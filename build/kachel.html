<!DOCTYPE html>
<meta charset="utf-8">
<title>kachel</title>
<body style="margin:0;background:#fff">
<pre id="out" style="font:10px/1.1 monospace;word-break:break-all;white-space:pre-wrap">warte…</pre>
<script>
const q = new URLSearchParams(location.search);
const src = q.get("src");
const breite = parseInt(q.get("w") || "1280", 10);
const hoehe = Math.round(breite * 9 / 16);
const luftX = parseFloat(q.get("luftx") || "0.14");
const luftY = parseFloat(q.get("lufty") || "0.20");

function rand(daten, w, h) {
  const at = (x, y) => (y * w + x) * 4;
  const ecke = daten.slice(0, 4);
  const gleich = (i) =>
    Math.abs(daten[i] - ecke[0]) < 14 &&
    Math.abs(daten[i + 1] - ecke[1]) < 14 &&
    Math.abs(daten[i + 2] - ecke[2]) < 14;
  let x1 = w, y1 = h, x2 = -1, y2 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (gleich(at(x, y))) continue;
      if (x < x1) x1 = x;
      if (y < y1) y1 = y;
      if (x > x2) x2 = x;
      if (y > y2) y2 = y;
    }
  }
  if (x2 < 0) return { x: 0, y: 0, w: w, h: h };
  return { x: x1, y: y1, w: x2 - x1 + 1, h: y2 - y1 + 1 };
}

const img = new Image();
img.onload = function () {
  const roh = document.createElement("canvas");
  roh.width = img.naturalWidth;
  roh.height = img.naturalHeight;
  const rctx = roh.getContext("2d");
  rctx.fillStyle = "#ffffff";
  rctx.fillRect(0, 0, roh.width, roh.height);
  rctx.drawImage(img, 0, 0);

  const feld = rand(rctx.getImageData(0, 0, roh.width, roh.height).data, roh.width, roh.height);

  const kachel = document.createElement("canvas");
  kachel.width = breite;
  kachel.height = hoehe;
  const kctx = kachel.getContext("2d");
  kctx.fillStyle = "#ffffff";
  kctx.fillRect(0, 0, breite, hoehe);
  kctx.imageSmoothingEnabled = true;
  kctx.imageSmoothingQuality = "high";

  const platzX = breite * (1 - luftX * 2);
  const platzY = hoehe * (1 - luftY * 2);
  const faktor = Math.min(platzX / feld.w, platzY / feld.h);
  const zielW = Math.round(feld.w * faktor);
  const zielH = Math.round(feld.h * faktor);
  kctx.drawImage(roh, feld.x, feld.y, feld.w, feld.h,
    Math.round((breite - zielW) / 2), Math.round((hoehe - zielH) / 2), zielW, zielH);

  document.getElementById("out").textContent =
    breite + "x" + hoehe + "|" + kachel.toDataURL("image/png");
};
img.onerror = function () { document.getElementById("out").textContent = "FEHLER"; };
img.src = src;
</script>
